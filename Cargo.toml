[package]
name = "sysmon"
version = "0.1.0"
edition = "2021"
description = "A terminal system monitor that shows CPU, memory, disk, and network saturation at once and names the current bottleneck."
license = "MIT"

[[bin]]
name = "sysmon"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
anyhow = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
