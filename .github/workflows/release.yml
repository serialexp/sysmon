name: Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  APP_NAME: sysmon

jobs:
  build-linux:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install musl linker
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install Rust target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Verify release binary
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/${APP_NAME}"
          test -x "$binary"
          "$binary" --version
          if ! file "$binary" | grep -q 'static'; then
            echo "::error::Release binary is not statically linked"
            file "$binary"
            exit 1
          fi

      - name: Package tarball
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          archive="${APP_NAME}-${version}-${{ matrix.target }}.tar.gz"
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/${APP_NAME}" dist/
          cp README.md dist/
          tar -C dist -czf "$archive" "${APP_NAME}" README.md

      - name: Upload artifact
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.target }}
          path: ${{ env.APP_NAME }}-*.tar.gz
          if-no-files-found: error

  publish:
    needs: build-linux
    runs-on: ubuntu-latest
    # Run after the release PR is merged (squash or regular merge).
    # Squash merge subjects may include a GitHub-generated suffix, e.g. (#45).
    if: >-
      github.event_name == 'push' &&
      (startsWith(github.event.head_commit.message, 'release:') ||
       (startsWith(github.event.head_commit.message, 'Merge') && contains(github.event.head_commit.message, 'release/')))
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 'lts/*'

      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA-256 checksums
        working-directory: artifacts
        run: sha256sum *.tar.gz > SHA256SUMS

      - name: Upload checksums
        uses: actions/upload-artifact@v5
        with:
          name: release-checksums
          path: artifacts/SHA256SUMS
          if-no-files-found: error

      - name: Publish GitHub release
        run: npx --yes just-release
        env:
          CI: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
